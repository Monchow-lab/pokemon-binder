<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pokémon Binder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: summary page of series → set tiles; each set opens a two-page binder spread (3x3 pockets per page) */
:root{
  --desk:#e7e9ee; --page:#f8f9fb; --pocket:#ffffff; --line:#d3d7df; --ink:#1b1e27; --muted:#626a7a;
  --spine:#2a3142; --accent:#d93a3a; --rv:#2f7fd6; --pb:#d93a3a; --mb:#7a4bd1; --en:#13958a; --holo:#8a93a6; --gold:#b8860b;
  --own:#1f8f5a; --warnbg:#fff4d6; --warn:#7a5a00; --tile:#ffffff;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --desk:#12141a; --page:#1b1f29; --pocket:#232836; --line:#343b4c; --ink:#e9ecf3; --muted:#9aa3b5;
  --spine:#0b0d12; --accent:#ff6262; --rv:#6aaeff; --pb:#ff6b6b; --mb:#b08cff; --en:#3fd1c2; --holo:#aab3c6; --gold:#e5b94a;
  --own:#4cd18f; --warnbg:#3a3017; --warn:#f2d27a; --tile:#1f2430; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:14px;padding:20px 16px 40px}
.wrap{max-width:1240px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
a{color:inherit}
h1,h2{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-weight:800;font-size:clamp(1.6rem,3.5vw,2.3rem)}
h2{font-weight:800;font-size:clamp(1.3rem,2.6vw,1.7rem)}
.eyebrow{display:block;font-family:var(--mono);font-size:.72rem;font-weight:500;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:4px}
.row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.stats{display:flex;align-items:center;gap:12px;font-variant-numeric:tabular-nums}
.count{font-family:var(--mono);font-weight:700;font-size:1.05rem}
.count span{color:var(--muted);font-weight:500;font-size:.85rem}
.bar{width:180px;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--own);width:0;transition:width .3s}
button{font:inherit;font-weight:600;color:var(--ink);background:var(--pocket);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.primary{background:var(--ink);color:var(--page);border-color:var(--ink)}
button:disabled{opacity:.4;cursor:default}
input[type=search],select{font:inherit;color:var(--ink);background:var(--pocket);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=search]{flex:1 1 220px}
.sync{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--pocket);border:1px solid var(--line);font-size:13px}
.sync.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.sync .dot{width:9px;height:9px;border-radius:50%;background:var(--muted)}
.sync.ok .dot{background:var(--own)}
.sync .grow{flex:1 1 200px}

/* summary */
.series{display:flex;flex-direction:column;gap:12px;padding-top:8px}
.serieshead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px;border-bottom:1px solid var(--line);padding-bottom:10px;cursor:pointer;list-style:none}
.serieshead::-webkit-details-marker{display:none}
.serieshead h2{display:flex;align-items:flex-end;gap:10px}
.chev{display:inline-block;width:22px;height:22px;border-radius:6px;border:1px solid var(--line);position:relative;flex:none;margin-bottom:3px}
.chev::after{content:"";position:absolute;left:7px;top:5px;width:6px;height:6px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details:not([open]) .chev::after{transform:rotate(-45deg);left:5px;top:7px}
details.series[open] .serieshead{margin-bottom:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:12px;background:var(--tile);border:1px solid var(--line);text-decoration:none;cursor:pointer;transition:transform .12s,border-color .12s;min-width:0}
.tile:hover{transform:translateY(-2px);border-color:var(--muted)}
.tile .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.tile .logo{height:64px;display:flex;align-items:center;min-width:0}
.badge{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:46px;height:46px;padding:4px 6px;border-radius:9px;background:#fff;color:#14171f;box-shadow:0 1px 3px #0003}
.badge img{height:18px;width:auto;max-width:34px;object-fit:contain}
.badge b{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.04em;line-height:1}
.tile .logo img{max-height:64px;max-width:100%;object-fit:contain}
.tile .logo .alt{font-family:var(--display);font-weight:800;font-size:1.25rem}
.tile .nm{font-family:var(--display);font-weight:600;font-size:1.05rem}
.tile .dt{font-size:12px;color:var(--muted)}
.tile .prog{display:flex;align-items:center;gap:10px;font-variant-numeric:tabular-nums}
.tile .prog .bar{flex:1;width:auto}
.tile .prog b{font-family:var(--mono);font-size:.95rem;min-width:52px;text-align:right}
.tile .sub{font-family:var(--mono);font-size:12px;color:var(--muted)}
.tile.done{border-color:var(--own)}
.note{font-size:12px;color:var(--muted)}

/* set view */
.back{align-self:flex-start;text-decoration:none;font-weight:600;color:var(--muted)}
.back:hover{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;border:1px solid var(--line)}
.binder{display:grid;grid-template-columns:1fr 22px 1fr;background:var(--spine);border-radius:14px;padding:14px}
.spine{background:repeating-linear-gradient(var(--spine) 0 30px,#ffffff10 30px 34px)}
.page{background:var(--page);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.page.blank{align-items:center;justify-content:center;color:var(--muted);font-family:var(--mono);font-size:12px}
.pagehead{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.slot{position:relative;display:flex;flex-direction:column;gap:5px;min-width:0}
.pocket{position:relative;aspect-ratio:63/88;max-width:100%;border-radius:7px;overflow:hidden;background:var(--pocket);border:1px dashed var(--line);cursor:pointer;padding:0;display:block;width:100%;transition:transform .12s}
.pocket:hover{transform:translateY(-2px)}
.pocket img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);opacity:.38;transition:filter .2s,opacity .2s}
.slot.owned .pocket{border:2px solid var(--own)}
.slot.owned .pocket img{filter:none;opacity:1}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px;padding:8px;text-align:center;font-family:var(--display);font-weight:600;font-size:.9rem;color:var(--muted)}
.fallback b{font-family:var(--mono);font-size:1.3rem;color:var(--ink)}
.tick{position:absolute;right:6px;bottom:6px;width:22px;height:22px;border-radius:6px;border:2px solid #fff;background:#0006;display:grid;place-items:center}
.slot.owned .tick{background:var(--own);border-color:var(--own)}
.slot.owned .tick::after{content:"";width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.zoom{position:absolute;left:6px;top:6px;width:26px;height:26px;padding:0;border-radius:6px;border:0;background:#000a;color:#fff;font-size:14px;line-height:26px;opacity:0;transition:opacity .15s}
.slot:hover .zoom,.zoom:focus-visible{opacity:1}
@media (hover:none){.zoom{opacity:.85}}
.label{display:flex;align-items:center;gap:5px;font-size:11px;min-width:0}
.label .no{font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
.label .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);flex:1;min-width:0}
.vdot{width:8px;height:8px;border-radius:2px;flex:none;border:1px solid var(--line);background:var(--pocket)}
.c-rv{background:var(--rv);border-color:var(--rv)} .c-pb{background:var(--pb);border-color:var(--pb)} .c-mb{background:var(--mb);border-color:var(--mb)}
.c-en{background:var(--en);border-color:var(--en)} .c-holo{background:var(--holo);border-color:var(--holo)} .c-sec{background:var(--gold);border-color:var(--gold)}
.slot.hit .pocket{box-shadow:0 0 0 3px var(--accent)}
.slot.empty{visibility:hidden}
.nav{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.nav .where{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.loading{padding:40px;text-align:center;color:var(--muted);font-family:var(--mono);background:var(--page);border-radius:8px}
.lightbox{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;padding:24px;z-index:20}
.lightbox figure{margin:0;display:flex;flex-direction:column;gap:10px;align-items:center;color:#fff;max-height:100%}
.lightbox img{max-height:78vh;max-width:90vw;border-radius:12px}
.lightbox figcaption{font-family:var(--display);font-size:1.1rem;text-align:center}
.lightbox figcaption small{display:block;font-family:var(--mono);font-size:.75rem;opacity:.75;margin-top:2px}
@media (max-width:760px){.binder{grid-template-columns:1fr;padding:8px}.spine,.page.right{display:none}.grid{gap:7px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== summary ===== -->
  <section id="home" class="wrap" style="gap:28px">
    <div class="row">
      <h1><span class="eyebrow">Monchow's collection · English TCG total</span>Pokémon Binder</h1>
      <div class="stats"><div class="count" id="allcount"></div><div class="bar"><i id="allbar"></i></div><div class="count" id="allpct"></div></div>
    </div>
    <div id="serieslist" class="wrap" style="gap:32px"></div>
    <p class="note">Every print counts as its own pocket, so reverse holos and ball reverses are counted separately. English card data and images come from TCGdex, refreshed every few days (<button id="refresh" style="padding:2px 8px;font-size:12px">Refresh card data now</button>). Collect 151 images come from Bill's Archive.</p>
  </section>

  <!-- ===== set binder ===== -->
  <section id="setview" class="wrap" hidden>
    <a href="#" class="back">← All sets</a>
    <div class="row">
      <h1><span class="eyebrow" id="setmeta"></span><span id="settitle"></span></h1>
      <div class="stats"><div class="count" id="count"></div><div class="bar"><i id="bar"></i></div><div class="count" id="pct"></div></div>
    </div>
    <div class="tools">
      <input type="search" id="q" placeholder="Find a card: name or number, e.g. Gengar or 094">
      <select id="jump" aria-label="Jump to section"></select>
      <select id="mode" aria-label="Show">
        <option value="all">Show every pocket</option>
        <option value="missing">Fade what I own</option>
      </select>
    </div>
    <div class="legend" id="legend"></div>
    <div class="binder" id="binder"></div>
    <div class="nav">
      <button id="prev">← Previous</button>
      <span class="where" id="where"></span>
      <button id="next" class="primary">Next →</button>
    </div>
  </section>

  <div class="sync" id="sync"><span class="dot"></span><span class="grow" id="syncmsg"></span><span id="syncbtns"></span></div>
</div>

<div class="lightbox" id="lightbox" hidden></div>

<script>
const IMG = "https://bills-archive.nyc3.cdn.digitaloceanspaces.com/cn_cards/";
const SETS = [];
/* ---------- Collect 151 (Simplified Chinese, 151C) ---------- */
(function(){
  // dex order: "<code> <image slug>" for 001–151
  const CODES = "p001 bulbasaur|p002 ivysaur|y1180 venusaur-ex|p004 charmander|p005 charmeleon|y1181 charizard-ex|p007 squirtle|p008 wartortle|y1182 blastoise-ex|p010 caterpie|p011 metapod|p012 butterfree|p013 weedle|p014 kakuna|p015 beedrill|p016 pidgey|p017 pidgeotto|p018 pidgeot|p0019 rattata|p0020 raticate|p021 spearow|p022 fearow|p023 ekans|y1183 arbok-ex|p025 pikachu|p026 raichu|y890 sandshrew|y891 sandslash|p029 nidoran|p030 nidorina|p031 nidoqueen|p032 nidoran|p033 nidorino|p034 nidoking|p035 clefairy|p036 clefable|y393 vulpix|y1184 ninetales-ex|p039 jigglypuff|y1185 wigglytuff-ex|p041 zubat|p042 golbat|p043 oddish|p044 gloom|p045 vileplume|p046 paras|p047 parasect|p048 venonat|p049 venomoth|y395 diglett|y396 dugtrio|y397 meowth|y398 persian|p054 psyduck|p055 golduck|p056 mankey|p057 primeape|p058 growlithe|p059 arcanine|p060 poliwag|p061 poliwhirl|p062 poliwrath|p0063 abra|p0064 kadabra|y1186 alakazam-ex|p066 machop|p067 machoke|p068 machamp|p069 bellsprout|p070 weepinbell|p071 victreebel|p072 tentacool|p073 tentacruel|y399 geodude|y400 graveler|y1187 golem-ex|p077 ponyta|p078 rapidash|p079 slowpoke|p080 slowbro|p081 magnemite|p082 magneton|p083 farfetchd|p084 doduo|p085 dodrio|p086 seel|p087 dewgong|y539 grimer|y540 muk|p090 shellder|p091 cloyster|p092 gastly|p093 haunter|p094 gengar|p095 onix|p096 drowzee|p097 hypno|p098 krabby|p099 kingler|p100 voltorb|p101 electrode|p102 exeggcute|y402 exeggutor|p104 cubone|y712 marowak|p106 hitmonlee|p107 hitmonchan|p108 lickitung|p109 koffing|p110 weezing|p111 rhyhorn|p112 rhydon|p113 chansey|p114 tangela|y1188 kangaskhan-ex|p116 horsea|p117 seadra|p118 goldeen|p119 seaking|p120 staryu|p121 starmie|p122 mr-mime|p123 scyther|y1189 jynx-ex|p125 electabuzz|p126 magmar|p127 pinsir|p128 tauros|p129 magikarp|p130 gyarados|p131 lapras|y1074 ditto|p133 eevee|p134 vaporeon|p135 jolteon|p136 flareon|p137 porygon|y1218 omanyte|y1219 omastar|p1220 kabuto|p141 kabutops|y1221 aerodactyl|p143 snorlax|p144 articuno|y1190 zapdos-ex|p146 moltres|p147 dratini|p148 dragonair|p149 dragonite|p150 mewtwo|y1191 mew-ex".split("|");
  const NAMES = "Bulbasaur,Ivysaur,Venusaur ex,Charmander,Charmeleon,Charizard ex,Squirtle,Wartortle,Blastoise ex,Caterpie,Metapod,Butterfree,Weedle,Kakuna,Beedrill,Pidgey,Pidgeotto,Pidgeot,Rattata,Raticate,Spearow,Fearow,Ekans,Arbok ex,Pikachu,Raichu,Sandshrew,Sandslash,Nidoran♀,Nidorina,Nidoqueen,Nidoran♂,Nidorino,Nidoking,Clefairy,Clefable,Vulpix,Ninetales ex,Jigglypuff,Wigglytuff ex,Zubat,Golbat,Oddish,Gloom,Vileplume,Paras,Parasect,Venonat,Venomoth,Diglett,Dugtrio,Meowth,Persian,Psyduck,Golduck,Mankey,Primeape,Growlithe,Arcanine,Poliwag,Poliwhirl,Poliwrath,Abra,Kadabra,Alakazam ex,Machop,Machoke,Machamp,Bellsprout,Weepinbell,Victreebel,Tentacool,Tentacruel,Geodude,Graveler,Golem ex,Ponyta,Rapidash,Slowpoke,Slowbro,Magnemite,Magneton,Farfetch'd,Doduo,Dodrio,Seel,Dewgong,Grimer,Muk,Shellder,Cloyster,Gastly,Haunter,Gengar,Onix,Drowzee,Hypno,Krabby,Kingler,Voltorb,Electrode,Exeggcute,Exeggutor,Cubone,Marowak,Hitmonlee,Hitmonchan,Lickitung,Koffing,Weezing,Rhyhorn,Rhydon,Chansey,Tangela,Kangaskhan ex,Horsea,Seadra,Goldeen,Seaking,Staryu,Starmie,Mr. Mime,Scyther,Jynx ex,Electabuzz,Magmar,Pinsir,Tauros,Magikarp,Gyarados,Lapras,Ditto,Eevee,Vaporeon,Jolteon,Flareon,Porygon,Omanyte,Omastar,Kabuto,Kabutops,Aerodactyl,Snorlax,Articuno,Zapdos ex,Moltres,Dratini,Dragonair,Dragonite,Mewtwo,Mew ex".split(",");
  const RAR = "CUDCUDCUDCCUCCRCCUCUCUCDCRCUCUUCURCUCDCDCUCURCUCUCUCUCUCUCUCCUCUDCURCCUCUCUDCUCUCUCCRCUCUCUCURUCUCUCRCUCRUUCCRCURCDCUCUCRRUDCCUUCRURCRRRCURURRURDRCURRD";
  const RN = {C:"C",U:"U",R:"R",D:"RR"};
  const url = (no, ver, pack) => { const [code, slug] = CODES[no-1].split(" "); const p = pack || "151c"; return `${IMG}${p}/${p}-${code}_${slug}${ver>1?"-"+ver:""}.webp`; };
  const cards = [];
  NAMES.forEach((n,i)=>{ const no=i+1, r=RN[RAR[i]];
    cards.push({no,name:n,rar:r,v:"Normal",cls:"",img:url(no,1)});
    if(r!=="RR"){
      cards.push({no,name:n,rar:r,v:"Poké Ball",cls:"pb",img:url(no,2)});
      cards.push({no,name:n,rar:r,v:"Master Ball",cls:"mb",img:url(no,3)});
    }
  });
  const sec = (no,name,rar,v,img) => cards.push({no,name,rar,v,cls:"sec",img});
  [4,16,17,26,39,43,44,45,63,64,84,85,100,101,120,121,132,143].forEach((d,i)=>sec(152+i,NAMES[d-1],"S","Shiny rare",url(d,4)));
  [["Journey","151c1"],["Hope","151c2"],["Surprise","151c3"],["Gathering","151c4"]].forEach(([p,pk],i)=>sec(170+i,"Pikachu","AR",p+" AR",url(25,1,pk)));
  [3,6,9,24,38,40,65,76,115,124,145,151].forEach((d,i)=>sec(174+i,NAMES[d-1],"SR","SR",url(d,2)));

  sec(191,"Mew ex","SAR","Surprise SAR",url(151,1,"151c3"));
  sec(192,"Mew ex","UR","UR",url(151,4));
  SETS.push({
    id:"c151", title:"Collect 151", meta:"151C · Simplified Chinese · Master set", outOf:151,
    jumps:[[1,"001–151 main set"],[152,"152 Shiny rares"],[170,"170 Pikachu ARs"],[174,"174 ex SR"],[186,"186 Shiny SR"],[189,"189 SAR & UR"]],
    cards
  });
})();



/* ============================================================
   SERIES — the summary page. English sets load their card list from TCGdex.
   To add a set: add {id (TCGdex id), title, code, date} to a series below.
   ============================================================ */
const SERIES = [
  { id:"me", title:"Mega Evolution", eyebrow:"English TCG", sets:[
    {id:"me06",   title:"Delta Reign",                     code:"DLR",  date:"2026-11-06"},

    {id:"me02",   title:"Phantasmal Flames",               code:"PFL",  date:"2025-11-14"},
    {id:"me01",   title:"Mega Evolution",                  code:"MEG",  date:"2025-09-26"},
    {id:"mep",    title:"Black Star Promos",               code:"MEP",  date:"2025-09-26"},
    {id:"mee",    title:"Mega Evolution Energy",           code:"MEE",  date:"2025-09-25"},
  ]},
  { id:"sv", title:"Scarlet & Violet", eyebrow:"English TCG", sets:[
    {id:"sv10.5w", title:"White Flare",          code:"WHT", date:"2025-07-18"},
    {id:"sv10.5b", title:"Black Bolt",           code:"BLK", date:"2025-07-18"},
    {id:"sv10",    title:"Destined Rivals",      code:"DRI", date:"2025-05-30"},
    {id:"sv09",    title:"Journey Together",     code:"JTG", date:"2025-03-28"},
    {id:"sv08.5",  title:"Prismatic Evolutions", code:"PRE", date:"2025-01-17"},
    {id:"sv08",    title:"Surging Sparks",       code:"SSP", date:"2024-11-08"},
    {id:"sv07",    title:"Stellar Crown",        code:"SCR", date:"2024-09-13"},

const TCG = "https://api.tcgdex.net/v2/en";
const PKSYM = {"me06":"me06","30th":"cel30","30th-c":"cel30c","me05":"me05","me04":"me04","me03":"me03","me02.5":"me02pt5","me02":"me02","me01":"me01","mep":"MEP","mee":"mee",
  "sv10.5w":"sv10pt5_wht","sv10.5b":"sv10pt5_blk","sv10":"sv10","sv09":"sv9","sv08.5":"sv8pt5","sv08":"sv8","sv07":"sv7","sv06.5":"sv6pt5","sv06":"sv6","sv05":"sv5","sv04.5":"sv4pt5","sv04":"sv4","sv03.5":"sv3pt5","sv03":"sv3","sv02":"sv2","sv01":"sv1","svp":"svp","sve":"sve23","swsh12.5gg":"swsh12pt5gg","swsh12.5":"swsh12pt5","swsh12tg":"swsh12tg","swsh12":"swsh12","swsh11tg":"swsh11tg","swsh11":"swsh11","swsh10.5":"pgo","swsh10tg":"swsh10tg","swsh10":"swsh10","swsh9tg":"swsh9tg","swsh9":"swsh9","swsh8":"swsh8","cel25cc":"cel25c","cel25":"cel25","swsh7":"swsh7","swsh6":"swsh6","swsh5":"swsh5","swsh4.5sv":"swsh45sv","swsh4.5":"swsh45","swsh4":"swsh4","swsh3.5":"swsh35","swsh3":"swsh3","swsh2":"swsh2","swsh1":"swsh1","swshp":"swshp"};
const seriesOf = id => (SERIES.find(sr=>sr.sets.some(m=>m.id===id))||{id:"me"}).id;
const CACHE = "pkmn-binder-cards-v2", CACHE_DAYS = 3;
const FOIL = {"":"Reverse holo",pokeball:"Poké Ball",masterball:"Master Ball",energy:"Energy reverse",friendball:"Friend Ball",loveball:"Love Ball",quickball:"Quick Ball",duskball:"Dusk Ball","team-rocket":"Team Rocket"};
const RARE = {"common":"C","uncommon":"U","rare":"R","double rare":"RR","illustration rare":"IR","ultra rare":"UR","special illustration rare":"SIR","mega hyper rare":"MHR","mega attack rare":"MAR","hyper rare":"HR","shiny rare":"SR","none":""};
let cache = {};
try{ localStorage.removeItem("pkmn-binder-cards-v1"); }catch(e){}
try{ cache = JSON.parse(localStorage.getItem(CACHE)) || {}; }catch(e){}
const saveCache = () => { try{ localStorage.setItem(CACHE, JSON.stringify(cache)); }catch(e){} };

async function pool(items, n, fn){ let i=0; await Promise.all(Array.from({length:n}, async()=>{ while(i<items.length){ const k=i++; await fn(items[k],k); } })); }

async function fetchSet(id, force){
  const c = cache[id];
  if(!force && c && Date.now()-c.at < CACHE_DAYS*864e5) return c;
  const st = await fetch(`${TCG}/sets/${encodeURIComponent(id)}`).then(r=>{ if(!r.ok) throw r.status; return r.json(); });
  const rows = new Array(st.cards.length);
  await pool(st.cards, 10, async (c,k)=>{
    let d = {};
    try{ d = await fetch(`${TCG}/cards/${encodeURIComponent(c.id)}`).then(r=>r.json()); }catch(e){}
    const vs = [];
    for(const v of (d.variants_detailed||[])){
      if(v.stamp || v.foil==="cosmos" || (v.size && v.size!=="standard")) continue;
      const key = v.type==="reverse" ? "r-"+(v.foil||"") : v.type[0];
      if(!vs.includes(key)) vs.push(key);
    }
    if(!vs.length) vs.push("n");
    rows[k] = [c.localId, c.name, d.rarity||"", vs, c.image || `https://assets.tcgdex.net/en/${seriesOf(id)}/${id}/${c.localId}`];
  });
  cache[id] = { at:Date.now(), official:(st.cardCount&&st.cardCount.official)||rows.length+999, logo:st.logo||"", rows };
  saveCache();
  return cache[id];
}
const ORDER = k => k==="n"?0 : k==="h"?1 : k==="r-"?2 : 3;
function buildCards(id){
  const c = cache[id]; if(!c) return null;
  const cards = [];
  for(const [lid, name, rarity, vs, img] of c.rows){
    const no = parseInt(lid,10), secret = no > c.official && c.official < c.rows.length+999, rar = RARE[(rarity||"").toLowerCase()] ?? rarity;
    const sorted = [...vs].sort((a,b)=>ORDER(a)-ORDER(b));
    for(const k of sorted){
      let v, cls;
      if(k==="n"){ v = vs.includes("h") ? "Non-holo" : "Normal"; cls = ""; }
      else if(k==="h"){ v = secret ? (rarity||"Secret rare") : "Holo"; cls = secret ? "sec" : "holo"; }
      else { const f = k.slice(2); v = FOIL[f] || (f.replace(/-/g," ")+" reverse"); cls = f==="" ? "rv" : f==="masterball" ? "mb" : f==="energy" ? "en" : "pb"; }
      cards.push({ no: isNaN(no)?9999:no, disp: isNaN(no)?lid:pad(no), lid, name, rar, v, cls, id: lid+"-"+k, img: img? img+"/low.webp":"", imgHi: img? img+"/high.webp":"" });
    }
  }
  return cards;
}

const dsp = c => c.disp || pad(c.no);

/* ---------- sync via a private GitHub gist (works on PCs and phone) ---------- */
const GH="https://api.github.com", GDESC="Pokemon Binder progress", GFILE="binder-progress.json";
let gh={token:null,gist:null}, syncState="off"; // off | ok | saving | error
try{ const g=JSON.parse(localStorage.getItem("pkmn-binder-gh")); if(g&&g.token) gh=g; }catch(e){}
const saveGh=()=>{ try{ localStorage.setItem("pkmn-binder-gh",JSON.stringify(gh)); }catch(e){} };
async function api(path,opts={}){
  const r=await fetch(GH+path,{...opts,headers:{"Authorization":"Bearer "+gh.token,"Accept":"application/vnd.github+json",...(opts.body?{"Content-Type":"application/json"}:{})}});
  if(!r.ok){ const e=new Error(r.status); e.status=r.status; throw e; }
  return r.status===204?null:r.json();
}
async function findOrCreateGist(){
  for(let page=1;page<=5;page++){
    const list=await api(`/gists?per_page=100&page=${page}`);
    const g=list.find(x=>x.description===GDESC && x.files[GFILE]);
    if(g) return g.id;
    if(list.length<100) break;
  }
  const g=await api("/gists",{method:"POST",body:JSON.stringify({description:GDESC,public:false,files:{[GFILE]:{content:JSON.stringify(progress,null,1)}}})});
  return g.id;
}
async function pull(){
  const g=await api("/gists/"+gh.gist), f=g.files[GFILE];
  if(!f) return;
  let txt=f.content;
  if(f.truncated) txt=await (await fetch(f.raw_url)).text();
  const remote=JSON.parse(txt);
  if(remote && remote.sets && (!progress.updated || (remote.updated||"")>=progress.updated)){ progress=remote; saveLocal(); }
  else if(progress.updated && (remote.updated||"")<progress.updated){ push(); }
}
let pushTimer=null;
function push(){
  if(!gh.token||!gh.gist) return;
  clearTimeout(pushTimer); syncState="saving"; syncUI();
  pushTimer=setTimeout(async()=>{
    try{ await api("/gists/"+gh.gist,{method:"PATCH",body:JSON.stringify({files:{[GFILE]:{content:JSON.stringify(progress,null,1)}}})}); syncState="ok"; }
    catch(e){ syncState="error"; }
    syncUI();
  },800);
}
const writeToFile=push;
async function connect(token){
  gh={token:token.trim(),gist:null};
  try{ gh.gist=await findOrCreateGist(); saveGh(); await pull(); syncState="ok"; render(); }
  catch(e){ gh={token:null,gist:null}; syncState="off"; flash(e.status===401?"GitHub didn't accept that key. Check you copied all of it and that it has Gists read and write access.":"Couldn't reach GitHub. Check you're online and try again."); return; }
  syncUI();
}
async function initFile(){
  if(!gh.token){ syncUI(); return; }
  try{ if(!gh.gist){ gh.gist=await findOrCreateGist(); saveGh(); } await pull(); syncState="ok"; render(); }
  catch(e){ syncState="error"; }
  syncUI();
}
function exportFile(){
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(progress,null,1)],{type:"application/json"}));
  a.download="binder-progress.json"; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function importFile(){
  const i=document.createElement("input"); i.type="file"; i.accept=".json,application/json";
  i.onchange=async()=>{ try{ const p=JSON.parse(await i.files[0].text()); if(!p.sets) throw 0; progress=p; progress.updated=new Date().toISOString(); saveLocal(); push(); render(); flash("Progress loaded"); }catch(e){ flash("That file isn't a binder progress file."); } };
  i.click();
}
let flashTimer=null;
function flash(t){ $("syncmsg").textContent=t; clearTimeout(flashTimer); flashTimer=setTimeout(syncUI,4000); }
function syncUI(){
  const box=$("sync"), msg=$("syncmsg"), btns=$("syncbtns");
  box.className="sync"; btns.innerHTML="";
  const b=(label,fn,primary)=>{ const el=document.createElement("button"); el.textContent=label; if(primary) el.className="primary"; el.onclick=fn; btns.appendChild(el); btns.append(" "); };
  if(gh.token && syncState!=="error"){
    box.classList.add("ok");
    msg.textContent = syncState==="saving" ? "Saving to GitHub…" : "Synced with GitHub. Ticks show up on your other devices next time you open the binder.";
    b("Sync now", async()=>{ try{ await pull(); render(); flash("Up to date"); }catch(e){ flash("Couldn't reach GitHub."); } });
    b("Disconnect", ()=>{ gh={token:null,gist:null}; saveGh(); syncState="off"; syncUI(); });
  } else if(gh.token){
    box.classList.add("warn");
    msg.textContent="Couldn't save to GitHub. Your ticks are safe on this device; try again when you're online.";
    b("Try again", initFile, true);
  } else {
    box.classList.add("warn");
    msg.innerHTML=`Ticks are only saved on this device. Paste your GitHub key to sync your PCs and phone. <input type="password" id="tok" placeholder="github_pat_…" style="font:inherit;padding:6px 8px;border-radius:6px;border:1px solid var(--line);background:var(--pocket);color:var(--ink);width:min(260px,100%)">`;
    b("Connect", ()=>{ const t=$("tok").value; if(t.trim()) connect(t); else flash("Paste your GitHub key first."); }, true);
    b("Save backup", exportFile); b("Load backup", importFile);
  }
}


const allSets = () => SERIES.flatMap(s=>s.sets);
const metaOf = id => allSets().find(s=>s.id===id);
function cardsOf(id){ const m=metaOf(id); if(!m) return null; return m.local ? SETS.find(s=>s.id===id).cards : buildCards(id); }
function stat(id){
  const cs = cardsOf(id); if(!cs) return null;
  const valid = new Set(cs.map(c=>c.id)), own = (progress.sets[id]||[]).filter(x=>valid.has(x)).length;
  return { own, total: cs.length };
}

/* ---------- summary page ---------- */
const pct = (a,b) => b ? Math.round(a/b*1000)/10 : 0;
let openSeries = null;
try{ openSeries = JSON.parse(localStorage.getItem("pkmn-binder-open")); }catch(e){}
if(!openSeries) openSeries = { [SERIES[0].id]: true };

      const logo = m.local ? "" : m.logo || (cache[m.id]&&cache[m.id].logo) || `https://assets.tcgdex.net/en/${sr.id}/${m.id}/logo`;
      const p = st ? pct(st.own,st.total) : 0;
      return `<a class="tile ${st&&st.total&&st.own===st.total?"done":""}" href="#set-${encodeURIComponent(m.id)}">
        <div class="top"><div class="logo">${logo?`<img src="${esc(logo)}.png" alt="${esc(m.title)}" loading="lazy" onerror="this.outerHTML='<span class=alt>${esc(m.title)}</span>'">`:`<span class="alt">${esc(m.title)}</span>`}</div>
        <span class="badge" title="Set code ${esc(m.code)}">${PKSYM[m.id]?`<img src="https://site.pkmn.gg/images/sets/symbols/${PKSYM[m.id]}.webp" alt="" loading="lazy" onerror="this.remove()">`:""}<b>${esc(m.code)}</b></span></div>
        <div><div class="nm">${esc(m.title)}</div><div class="dt">${new Date(m.date).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}${m.sub?" · "+esc(m.sub):""} · ${esc(m.code)}</div></div>

/* ---------- binder ---------- */
let view = "home", setId = null, spread = 0, hit = null;
const perView = () => matchMedia("(max-width:760px)").matches ? 1 : 2;
const curCards = () => cardsOf(setId) || [];
const pages = () => Math.max(1, Math.ceil(curCards().length/9));
const maxSpread = () => Math.ceil(pages()/perView())-1;
const owned = () => new Set(progress.sets[setId] || []);

function pageHTML(p, side){
  const cs = curCards(), own = owned(), fade = $("mode").value==="missing";
  if(p>=pages()) return `<div class="page blank ${side}">End of set</div>`;
  const slice = cs.slice(p*9,p*9+9);
  let h = `<div class="page ${side}"><div class="pagehead"><span>Page ${p+1}</span><span>${dsp(slice[0])}–${dsp(slice[slice.length-1])}</span></div><div class="grid">`;
  for(let k=0;k<9;k++){
    const i=p*9+k, c=cs[i];
    if(!c){ h+=`<div class="slot empty"></div>`; continue; }
    const o = own.has(c.id);
    const inner = c.img ? `<img src="${esc(c.img)}" alt="" loading="lazy" onerror="imgFail(this,${i})">` : `<span class="fallback"><b>${dsp(c)}</b>${esc(c.name)}<br>${esc(c.v)}</span>`;
    h += `<div class="slot ${o?"owned":""} ${hit===i?"hit":""}" style="${fade&&o?"opacity:.3":""}">
      <button class="pocket" data-i="${i}" aria-pressed="${o}" title="${esc(c.name)} ${dsp(c)} · ${esc(c.v)}" aria-label="${esc(c.name)} ${c.no}, ${esc(c.v)}">${inner}<span class="tick"></span></button>
      ${c.img?`<button class="zoom" data-z="${i}" aria-label="Enlarge ${esc(c.name)}">⤢</button>`:""}
      <div class="label"><span class="vdot c-${c.cls||"n"}"></span><span class="no">${dsp(c)}</span><span class="nm">${esc(c.name)} · ${esc(c.v)}</span></div>
    </div>`;
  }
  return h + `</div></div>`;
}
function imgFail(img,i){
  const c = curCards()[i], f = document.createElement("span");
  f.className="fallback"; f.innerHTML=`<b>${dsp(c)}</b>${esc(c.name)}<br>${esc(c.v)}`;
  img.replaceWith(f);
}
function legendHTML(cs){
  const L = {"":"Normal",holo:"Holo",rv:"Reverse holo",pb:"Ball reverse",mb:"Master Ball",en:"Energy reverse",sec:"Secret rare"};
  if(metaOf(setId)?.local){ L.pb="Poké Ball reverse"; }
  const seen = [...new Set(cs.map(c=>c.cls||""))];
  return seen.map(k=>`<span><b class="c-${k||"n"}"></b>${L[k]}</span>`).join("") + `<span>Click a card to mark it collected · ← → to turn pages</span>`;
}
function renderSet(){
  const m = metaOf(setId), cs = curCards();
  $("settitle").textContent = m.title;
  const loc = SETS.find(s=>s.id===setId);
  $("setmeta").textContent = loc ? loc.meta : `${m.code} · English · ${cache[setId]?(cache[setId].official<cache[setId].rows.length?cache[setId].official+" cards + secret rares":cache[setId].rows.length+" cards"):""}`;
  document.title = m.title + " · Pokémon Binder";
  if(!cs.length){ $("binder").innerHTML=`<div class="loading" style="grid-column:1/-1">Loading cards from TCGdex…</div>`; $("legend").innerHTML=""; return; }
  spread = Math.max(0, Math.min(spread, maxSpread()));
  $("legend").innerHTML = legendHTML(cs);
  const b = $("binder");
  if(perView()===2){ const L=spread*2; b.innerHTML = pageHTML(L,"left")+`<div class="spine"></div>`+pageHTML(L+1,"right"); }
  else b.innerHTML = pageHTML(spread,"left");
  const first = spread*perView()+1, last = Math.min(pages(), first+perView()-1);
  $("where").textContent = (first===last?`Page ${first}`:`Pages ${first}–${last}`)+` of ${pages()}`;
  $("prev").disabled = spread===0; $("next").disabled = spread>=maxSpread();
  const st = stat(setId), p = pct(st.own, st.total);
  $("count").innerHTML = `${st.own}<span>/${st.total}</span>`; $("pct").textContent = p+"%"; $("bar").style.width = p+"%";
}
function render(){ view==="home" ? renderHome() : renderSet(); }
function goTo(i){ spread = Math.floor(Math.floor(i/9)/perView()); hit = i; renderSet(); }

/* ---------- routing ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  if(h.startsWith("set-") && metaOf(h.slice(4))){
    const id = h.slice(4);
    if(id!==setId){ spread=0; hit=null; $("q").value=""; }
    setId = id; view = "set";
    const m = metaOf(id);
    const jumps = m.local ? SETS.find(s=>s.id===id).jumps : (cache[id] ? (cache[id].official < cache[id].rows.length ? [[1,"Main set"],[cache[id].official+1,"Secret rares"]] : [[1,"Start"]]) : []);
    $("jump").innerHTML = `<option value="">Jump to…</option>` + jumps.map(([n,l])=>`<option value="${n}">${esc(l)}</option>`).join("");
    $("home").hidden = true; $("setview").hidden = false;
    if(!m.local && !cache[id]) fetchSet(id).then(()=>{ if(setId===id) route(); }).catch(()=>{ $("binder").innerHTML=`<div class="loading" style="grid-column:1/-1">Couldn't load this set from TCGdex. Check you're online and refresh.</div>`; });
    renderSet(); window.scrollTo(0,0);
  } else {
    view = "home"; $("home").hidden = false; $("setview").hidden = true; document.title = "Pokémon Binder"; renderHome();
  }
}
addEventListener("hashchange", route);
document.addEventListener("toggle", e=>{ const d=e.target; if(!d.matches || !d.matches("details.series")) return; openSeries[d.dataset.sr]=d.open; try{ localStorage.setItem("pkmn-binder-open", JSON.stringify(openSeries)); }catch(err){} }, true);

/* ---------- events ---------- */
$("binder").addEventListener("click", e=>{
  const z = e.target.closest("[data-z]");
  if(z){ const c = curCards()[+z.dataset.z], lb = $("lightbox");
    lb.innerHTML = `<figure><img src="${esc(c.imgHi)}" alt="${esc(c.name)}"><figcaption>${esc(c.name)}<small>${dsp(c)} · ${esc(c.v)}${c.rar?" · "+esc(c.rar):""}</small></figcaption></figure>`;
    lb.hidden = false; return; }
  const p = e.target.closest(".pocket[data-i]"); if(!p) return;
  const c = curCards()[+p.dataset.i], list = new Set(progress.sets[setId]||[]);
  list.has(c.id) ? list.delete(c.id) : list.add(c.id);
  progress.sets[setId] = [...list]; progress.updated = new Date().toISOString();
  saveLocal(); writeToFile(); hit = null; renderSet();
  document.querySelector(`.pocket[data-i="${p.dataset.i}"]`)?.focus();
});
$("lightbox").onclick = () => { $("lightbox").hidden = true; };
$("prev").onclick = () => { spread--; hit=null; renderSet(); };
$("next").onclick = () => { spread++; hit=null; renderSet(); };
document.addEventListener("keydown", e=>{
  if(e.key==="Escape") $("lightbox").hidden = true;
  if(view!=="set" || e.target.matches("input,textarea,select")) return;
  if(e.key==="ArrowRight" && spread<maxSpread()){ spread++; hit=null; renderSet(); }
  if(e.key==="ArrowLeft" && spread>0){ spread--; hit=null; renderSet(); }
});
$("q").addEventListener("input", e=>{
  const q = e.target.value.trim().toLowerCase(); if(!q){ hit=null; renderSet(); return; }
  const cs = curCards(), i = /^\d+$/.test(q) ? cs.findIndex(c=>c.no===+q) : cs.findIndex(c=>c.name.toLowerCase().includes(q));
  if(i>=0) goTo(i);
});
$("jump").addEventListener("change", e=>{ const n=+e.target.value; if(n){ const i=curCards().findIndex(c=>c.no>=n); if(i>=0) goTo(i); } e.target.value=""; });
$("mode").addEventListener("change", renderSet);
$("refresh").onclick = async e => { e.target.disabled = true; e.target.textContent = "Refreshing…"; await loadAll(true); e.target.textContent = "Refreshed"; };
let lastView = perView();
addEventListener("resize", ()=>{ if(view==="set" && perView()!==lastView){ const p=spread*lastView; lastView=perView(); spread=Math.floor(p/lastView); renderSet(); } else lastView=perView(); });
document.addEventListener("visibilitychange", async()=>{ if(!document.hidden && gh.token && syncState==="ok"){ try{ await pull(); render(); }catch(e){} } });


/* ---------- one-off import of collected cards from pkmn.gg ---------- */
const PK = {M:"r-masterball",n:"n",h:"h",r:"r-",E:"r-energy",P:"r-pokeball",F:"r-friendball",L:"r-loveball",Q:"r-quickball",D:"r-duskball",R:"r-team-rocket"};
async function runImport(){
  let batches; try{ batches = await fetch("pkmn-import.json",{cache:"no-store"}).then(r=>r.ok?r.json():null); }catch(e){ return; }
  if(!batches) return; if(!Array.isArray(batches)) batches=[batches];
  const todo = batches.filter(b=>!(progress.imports||[]).includes(b.id)); if(!todo.length) return;
  let added = 0, missed = [];
  for(const data of todo){
  for(const [sid, str] of Object.entries(data.sets)){
    if(!cache[sid]){ try{ await fetchSet(sid); }catch(e){ missed.push(sid+" (set not loaded)"); continue; } }
    const norm = x => String(x).toUpperCase().replace(/^([A-Z]*)0*(\d+)$/,"$1$2"); const byLid = {}, realLid = {}; for(const row of cache[sid].rows){ byLid[norm(row[0])] = row[3]; realLid[norm(row[0])] = row[0]; }
    const list = new Set(progress.sets[sid]||[]);
    for(const item of str.split(",")){
      const [plid, codes] = item.split(":"); const lid = realLid[norm(plid)]; const vs = byLid[norm(plid)];
      if(!vs){ missed.push(sid+" "+plid); continue; }
      for(const code of codes.split("+")){
        let k = PK[code];
        if(!vs.includes(k)){
          if(vs.length===1) k = vs[0];
          else if(k==="h" && vs.includes("n") && !vs.includes("h")) k = "n";
          else if(k==="n" && vs.includes("h") && !vs.includes("n")) k = "h";
          else if(k && k.startsWith("r-") && vs.includes("r-")) k = "r-";
          else { missed.push(sid+" "+lid+" "+code); continue; }
        }
        const id = lid+"-"+k; if(!list.has(id)){ list.add(id); added++; }
      }
    }
    progress.sets[sid] = [...list];
  }
  progress.imports = [...(progress.imports||[]), data.id];
  }
  progress.updated = new Date().toISOString();
  saveLocal(); writeToFile(); render();
  if(missed.length) console.warn("pkmn.gg import: not matched", missed);
  $("syncmsg").textContent = `Imported ${added} cards from pkmn.gg` + (missed.length ? ` (${missed.length} couldn't be matched)` : "") + ".";
  window.__importResult = {added, missed};
}

route();
Promise.all([initFile(), loadAll(false)]).then(runImport);
</script>
