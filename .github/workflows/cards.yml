name: Build card data
on:
  schedule:
    - cron: "17 4 * * *"   # every night
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths: [index.html, scripts/build-cards.mjs, .github/workflows/cards.yml]
permissions:
  contents: write
concurrency:
  group: cards
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-cards.mjs
      - name: Save the card file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/cards.json
          git diff --cached --quiet && exit 0
          git commit -m "Update card data"
          git pull --rebase origin main
          git push
